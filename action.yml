name: "Hiero Solo Action"
description: "Run a Hiero based network by using the solo tool"
inputs:
  installMirrorNode:
    description: "Defines if a mirror node should be installed"
    required: false
    default: false
    type: boolean
  installBlockNode:
    description: "Defines if a block node should be installed"
    required: false
    default: false
    type: boolean
  hieroVersion:
    description: "Version of Hiero consensus node to be used. Leave empty to use the version the selected Solo release is tested against."
    required: false
    default: ""
  mirrorNodeVersion:
    description: "Version of the mirror node to be used. Leave empty to use the version the selected Solo release is tested against."
    required: false
    default: ""
  mirrorNodePortRest:
    description: "Port for Mirror Node REST API"
    required: false
    default: "38081"
  mirrorNodePortGrpc:
    description: "Port for Mirror Node gRPC"
    required: false
    default: "5600"
  mirrorNodePortWeb3Rest:
    description: "Port for Mirror Node WEB3 REST"
    required: false
    default: "8545"
  installRelay:
    description: "Install JSON-RPC-Relay"
    required: false
    default: false
    type: boolean
  relayPort:
    description: "Port for JSON-RPC-Relay"
    required: false
    default: "37546"
  grpcProxyPort:
    description: "Port for gRPC Proxy"
    required: false
    default: "9998"
  dualModeGrpcProxyPort:
    description: "Port for the gRPC Proxy of the second consensus node (only if dual mode is enabled)"
    required: false
    default: "9999"
  haproxyPort:
    description: "Port for HAProxy (consensus node gRPC)"
    required: false
    default: "35211"
  soloVersion:
    description: "Version of Solo CLI to install (0.44.0 or newer)"
    required: false
    default: "0.92.0"
  javaRestApiPort:
    description: "Port for Java-based REST API"
    required: false
    default: "8084"
  dualMode:
    description: "Enable dual mode to deploy two consensus nodes"
    required: false
    default: false
    type: boolean
  nodeVersion:
    description: "Node.js version to use for Solo CLI installation"
    required: false
    default: "24"
  hbarAmount:
    description: "Amount of HBAR to be assigned to the created accounts"
    required: false
    default: "10000000"
outputs:
  accountId:
    description: "Account ID of the generated ED25519 account (default for simplicity)"
    value: ${{ steps.create-ed25519.outputs.accountId }}
  publicKey:
    description: "Public key of the generated ED25519 account (default for simplicity)"
    value: ${{ steps.create-ed25519.outputs.publicKey }}
  privateKey:
    description: "Private key of the generated ED25519 account in DER-encoded hex (default for simplicity)"
    value: ${{ steps.create-ed25519.outputs.privateKey }}
  deployment:
    description: "Name of the Solo deployment created by the action"
    value: "solo-deployment"
  ecdsaAccountId:
    description: "ECDSA account id of generated account"
    value: ${{ steps.create-ecdsa.outputs.accountId }}
  ecdsaPublicKey:
    description: "ECDSA public key of generated account"
    value: ${{ steps.create-ecdsa.outputs.publicKey }}
  ecdsaPrivateKey:
    description: "ECDSA private key of generated account"
    value: ${{ steps.create-ecdsa.outputs.privateKey }}
  ed25519AccountId:
    description: "ED25519 account id of generated account"
    value: ${{ steps.create-ed25519.outputs.accountId }}
  ed25519PublicKey:
    description: "ED25519 public key of generated account"
    value: ${{ steps.create-ed25519.outputs.publicKey }}
  ed25519PrivateKey:
    description: "ED25519 private key of generated account (DER-encoded hex)"
    value: ${{ steps.create-ed25519.outputs.privateKey }}
  ed25519PrivateKeyRaw:
    description: "ED25519 private key of generated account (raw 32-byte hex)"
    value: ${{ steps.create-ed25519.outputs.privateKeyRaw }}
runs:
  using: "composite"
  # Every step delegates to a script under scripts/; inputs reach the scripts only through env.
  steps:
    - name: Validate inputs
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.nodeVersion }}
        SOLO_VERSION: ${{ inputs.soloVersion }}
      run: bash "${{ github.action_path }}/scripts/validate-action-inputs.sh"

    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.nodeVersion }}

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.10"

    - name: Setup Kind
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        install_only: true
        node_image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
        version: v0.29.0
        kubectl_version: v1.32.2
        verbosity: 3
        wait: 120s

    - name: Install Solo CLI
      shell: bash
      env:
        SOLO_VERSION: ${{ inputs.soloVersion }}
      run: bash "${{ github.action_path }}/scripts/install-solo.sh"

    - name: Deploy consensus network
      shell: bash
      env:
        HIERO_VERSION: ${{ inputs.hieroVersion }}
        INSTALL_BLOCK_NODE: ${{ inputs.installBlockNode }}
        DUAL_MODE: ${{ inputs.dualMode }}
        HAPROXY_PORT: ${{ inputs.haproxyPort }}
        GRPC_PROXY_PORT: ${{ inputs.grpcProxyPort }}
        DUAL_MODE_GRPC_PROXY_PORT: ${{ inputs.dualModeGrpcProxyPort }}
      run: bash "${{ github.action_path }}/scripts/deploy-consensus-network.sh"

    # The relay needs the mirror node's ingress controller, so installRelay implies a mirror node.
    - name: Deploy mirror node
      if: ${{ inputs.installMirrorNode == 'true' || inputs.installRelay == 'true' }} # see https://github.com/actions/runner/issues/2238
      shell: bash
      env:
        MIRROR_NODE_VERSION: ${{ inputs.mirrorNodeVersion }}
        ENABLE_INGRESS: ${{ inputs.installRelay == 'true' }}
        MIRROR_NODE_PORT_REST: ${{ inputs.mirrorNodePortRest }}
        MIRROR_NODE_PORT_GRPC: ${{ inputs.mirrorNodePortGrpc }}
        MIRROR_NODE_PORT_WEB3_REST: ${{ inputs.mirrorNodePortWeb3Rest }}
        JAVA_REST_API_PORT: ${{ inputs.javaRestApiPort }}
      run: bash "${{ github.action_path }}/scripts/deploy-mirror-node.sh"

    - name: Deploy JSON-RPC relay
      if: ${{ inputs.installRelay == 'true' }}
      shell: bash
      env:
        RELAY_PORT: ${{ inputs.relayPort }}
      run: bash "${{ github.action_path }}/scripts/deploy-json-rpc-relay.sh"

    - name: Create ECDSA account
      id: create-ecdsa
      shell: bash
      env:
        HBAR_AMOUNT: ${{ inputs.hbarAmount || 10000000 }}
      run: bash "${{ github.action_path }}/scripts/create-funded-account.sh" ecdsa

    - name: Create ED25519 account
      id: create-ed25519
      shell: bash
      env:
        HBAR_AMOUNT: ${{ inputs.hbarAmount || 10000000 }}
      run: bash "${{ github.action_path }}/scripts/create-funded-account.sh" ed25519

# Ref: https://haya14busa.github.io/github-action-brandings/
branding:
  icon: "share-2"
  color: "gray-dark"
