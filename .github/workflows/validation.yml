name: PR Validation
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    # ready_for_review is not in the default type list; without it, un-drafting a PR fires no
    # event and the checks below would never start.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-outputs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo
        id: solo
        uses: ./

      - name: ✅ Validate Hiero Solo Outputs
        env:
          ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
          PRIVATE_KEY: ${{ steps.solo.outputs.privateKey }}
          PUBLIC_KEY: ${{ steps.solo.outputs.publicKey }}
          ECDSA_ACCOUNT_ID: ${{ steps.solo.outputs.ecdsaAccountId }}
          ECDSA_PRIVATE_KEY: ${{ steps.solo.outputs.ecdsaPrivateKey }}
          ECDSA_PUBLIC_KEY: ${{ steps.solo.outputs.ecdsaPublicKey }}
          ED25519_ACCOUNT_ID: ${{ steps.solo.outputs.ed25519AccountId }}
          ED25519_PRIVATE_KEY: ${{ steps.solo.outputs.ed25519PrivateKey }}
          ED25519_PRIVATE_KEY_RAW: ${{ steps.solo.outputs.ed25519PrivateKeyRaw }}
          ED25519_PUBLIC_KEY: ${{ steps.solo.outputs.ed25519PublicKey }}
        run: ${GITHUB_WORKSPACE}/scripts/check-accounts.sh

  validate-outputs-pre-0440:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo
        id: solo
        uses: ./
        with:
          # hieroVersion and mirrorNodeVersion are deliberately left unset: this job also covers the
          # action resolving them to the versions the pinned Solo release supports.
          soloVersion: '0.43.2'
          # Solo < 0.44 is the only place the legacy "mirror" Helm release name is exercised
          # (Solo >= 0.44 uses "mirror-1", covered by validate-mirror-node), so keep the mirror
          # node installed here to guard the fallback in the action's release-name lookup.
          installMirrorNode: true

      - name: ✅ Validate Hiero Solo Outputs
        env:
          ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
          PRIVATE_KEY: ${{ steps.solo.outputs.privateKey }}
          PUBLIC_KEY: ${{ steps.solo.outputs.publicKey }}
          ECDSA_ACCOUNT_ID: ${{ steps.solo.outputs.ecdsaAccountId }}
          ECDSA_PRIVATE_KEY: ${{ steps.solo.outputs.ecdsaPrivateKey }}
          ECDSA_PUBLIC_KEY: ${{ steps.solo.outputs.ecdsaPublicKey }}
          ED25519_ACCOUNT_ID: ${{ steps.solo.outputs.ed25519AccountId }}
          ED25519_PRIVATE_KEY: ${{ steps.solo.outputs.ed25519PrivateKey }}
          ED25519_PRIVATE_KEY_RAW: ${{ steps.solo.outputs.ed25519PrivateKeyRaw }}
          ED25519_PUBLIC_KEY: ${{ steps.solo.outputs.ed25519PublicKey }}
        run: ${GITHUB_WORKSPACE}/scripts/check-accounts.sh

  validate-hbar-amount:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo
        id: solo
        uses: ./
        with:
          hbarAmount: '100000001'

      - name: ✅ Validate Solo Account HBAR Amount
        env:
          ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
        run: solo ledger account info --account-id "${ACCOUNT_ID}" --deployment "solo-deployment"

  validate-block-node:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo with Block Node
        id: solo
        uses: ./
        with:
          installBlockNode: true

      - name: ✅ Validate Block Node Deployment
        run: |
          echo "Checking deployed resources..."
          kubectl get pods -n solo
          kubectl get svc -n solo

          BLOCK_NODE_POD=""
          for _ in $(seq 1 60); do
            BLOCK_NODE_POD=$(kubectl get pods -n solo -o name | grep 'block-node' | head -n 1 || true)
            if [ -n "${BLOCK_NODE_POD}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${BLOCK_NODE_POD}" ]; then
            echo "❌ Error: block node pod not found"
            kubectl get pods -n solo
            exit 1
          fi

          echo "Found block node pod: ${BLOCK_NODE_POD}"
          kubectl wait -n solo --for=condition=Ready "${BLOCK_NODE_POD}" --timeout=300s

  validate-mirror-node:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo with MirrorNode
        id: solo
        uses: ./
        with:
          installMirrorNode: true

      - name: ✅ Validate Mirror Node API
        run: |
          # Log Account details for Generic (ED25519), ECDSA, and ED25519
          echo "Generic Account ID (ED25519): ${{ steps.solo.outputs.accountId }}"
          echo "Generic Private Key (ED25519): ${{ steps.solo.outputs.privateKey }}"
          echo "Generic Public Key (ED25519): ${{ steps.solo.outputs.publicKey }}"
          echo "ECDSA Account ID: ${{ steps.solo.outputs.ecdsaAccountId }}"
          echo "ECDSA Private Key: ${{ steps.solo.outputs.ecdsaPrivateKey }}"
          echo "ECDSA Public Key: ${{ steps.solo.outputs.ecdsaPublicKey }}"

          echo "ED25519 Account ID: ${{ steps.solo.outputs.ed25519AccountId }}"
          echo "ED25519 Private Key: ${{ steps.solo.outputs.ed25519PrivateKey }}"
          echo "ED25519 Public Key: ${{ steps.solo.outputs.ed25519PublicKey }}"

          # Wait for the actual Kubernetes-level readiness signal instead of guessing with a fixed
          # sleep: the restjava pod's image pull + JVM start can take a while, especially right
          # after the mirror node deploy step returns.
          kubectl wait -n solo --for=condition=Ready pod -l app.kubernetes.io/name=restjava --timeout=300s

          # The setup step's own backgrounded port-forward for restjava may still be holding its
          # port but no longer actually forwarding traffic (a kubectl port-forward tunnel can go
          # dead without releasing its listening socket). Use a different local port so we always
          # get a fresh, known-good tunnel instead of racing/reusing that one.
          MIRROR_RESTJAVA_LOCAL_PORT=18084
          # Same label the readiness wait above uses, so the Service is found whatever Solo named
          # the mirror release (mirror-1-restjava on Solo >= 0.44, mirror-restjava before it).
          RESTJAVA_SVC=$(kubectl get svc -n solo -l app.kubernetes.io/name=restjava -o name | head -n1)
          if [ -z "${RESTJAVA_SVC}" ]; then
            echo "❌ Error: mirror node restjava service not found (label app.kubernetes.io/name=restjava)"
            kubectl get svc -n solo
            exit 1
          fi
          kubectl port-forward "${RESTJAVA_SVC}" -n solo "${MIRROR_RESTJAVA_LOCAL_PORT}:80" &
          PF_PID=$!
          trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT
          sleep 2

          # /api/v1/network/nodes is served by the Java REST module (javaRestApiPort), not the
          # JS REST module (mirrorNodePortRest) - mirror-node moved this endpoint there.
          # The pod is Ready by now, but poll a few times anyway in case the freshly started
          # port-forward itself needs a beat to finish establishing its tunnel.
          MAX_ATTEMPTS=10
          RESPONSE=000
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            RESPONSE=$(curl -s -w "%{http_code}" -X 'GET' "http://localhost:${MIRROR_RESTJAVA_LOCAL_PORT}/api/v1/network/nodes" -H 'accept: application/json' -o response.json || echo "000")
            if [ "${RESPONSE}" = "200" ]; then
              break
            fi
            echo "Mirror node API not ready yet (attempt ${attempt}/${MAX_ATTEMPTS}, status ${RESPONSE}), retrying in 3s..."
            sleep 3
          done

          if [ "${RESPONSE}" != "200" ]; then
            echo "❌ Error: API request failed with status code ${RESPONSE} after ${MAX_ATTEMPTS} attempts"
            cat response.json
            exit 1
          else
            echo "✅ API request successful"
            cat response.json
          fi

  validate-json-rpc-relay:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo with JSON-RPC Relay
        id: solo
        uses: ./
        with:
          installRelay: true

      - name: ✅ Validate JSON-RPC Relay
        env:
          ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
          PRIVATE_KEY: ${{ steps.solo.outputs.privateKey }}
          PUBLIC_KEY: ${{ steps.solo.outputs.publicKey }}
          ECDSA_ACCOUNT_ID: ${{ steps.solo.outputs.ecdsaAccountId }}
          ECDSA_PRIVATE_KEY: ${{ steps.solo.outputs.ecdsaPrivateKey }}
          ECDSA_PUBLIC_KEY: ${{ steps.solo.outputs.ecdsaPublicKey }}
          ED25519_ACCOUNT_ID: ${{ steps.solo.outputs.ed25519AccountId }}
          ED25519_PRIVATE_KEY: ${{ steps.solo.outputs.ed25519PrivateKey }}
          ED25519_PRIVATE_KEY_RAW: ${{ steps.solo.outputs.ed25519PrivateKeyRaw }}
          ED25519_PUBLIC_KEY: ${{ steps.solo.outputs.ed25519PublicKey }}
        run: |
          ${GITHUB_WORKSPACE}/scripts/check-accounts.sh

          # Log Account details for Generic (ED25519), ECDSA, and ED25519
          echo "Generic Account ID (ED25519): ${{ steps.solo.outputs.accountId }}"
          echo "Generic Private Key (ED25519): ${{ steps.solo.outputs.privateKey }}"
          echo "Generic Public Key (ED25519): ${{ steps.solo.outputs.publicKey }}"
          echo "ECDSA Account ID: ${{ steps.solo.outputs.ecdsaAccountId }}"
          echo "ECDSA Private Key: ${{ steps.solo.outputs.ecdsaPrivateKey }}"
          echo "ECDSA Public Key: ${{ steps.solo.outputs.ecdsaPublicKey }}"

          echo "ED25519 Account ID: ${{ steps.solo.outputs.ed25519AccountId }}"
          echo "ED25519 Private Key: ${{ steps.solo.outputs.ed25519PrivateKey }}"
          echo "ED25519 Public Key: ${{ steps.solo.outputs.ed25519PublicKey }}"

          # Look the Service up by the label Solo sets, which covers every Solo/chart version
          # (relay-1, relay-node1-hedera-json-rpc-relay, ...) and skips the "-ws" websocket Service.
          RELAY_SVC=$(kubectl get svc -n solo -l app.kubernetes.io/name=relay -o name | head -n1)
          if [ -z "${RELAY_SVC}" ]; then
            echo "❌ Error: JSON-RPC relay service not found (label app.kubernetes.io/name=relay)"
            kubectl get svc -n solo
            exit 1
          fi
          echo "Using relay Service: ${RELAY_SVC}"

          # The setup step already forwards the relay on 37546, but a kubectl port-forward tunnel
          # can go dead while still holding its listening socket. Use a dedicated local port so this
          # check always gets a fresh, known-good tunnel instead of racing that one for 37546.
          RELAY_LOCAL_PORT=17546
          kubectl port-forward "${RELAY_SVC}" -n solo "${RELAY_LOCAL_PORT}:7546" &
          PF_PID=$!
          trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT
          sleep 2

          RESPONSE=000
          for _ in $(seq 1 90); do
            RESPONSE=$(curl -s -w "%{http_code}" -X POST "http://localhost:${RELAY_LOCAL_PORT}" \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              -o response.json) || RESPONSE="000"
            if [ "$RESPONSE" = "200" ]; then
              break
            fi
            sleep 2
          done
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Error: JSON-RPC request failed with status code $RESPONSE"
            echo "Response body:"
            cat response.json
            echo "Checking if relay service is running:"
            kubectl get pods -n solo | grep relay
            exit 1
          fi
          CHAIN_ID=$(jq -r '.result' response.json)
          if [ -z "$CHAIN_ID" ] || [ "$CHAIN_ID" = "null" ]; then
            echo "❌ Error: Invalid or missing chainId in response"
            echo "Response body:"
            cat response.json
            exit 1
          fi
          echo "✅ JSON-RPC Relay request successful"
          echo "Chain ID: $CHAIN_ID"
          cat response.json

  validate-grpc-connections:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: hl-hsa-lin-md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo
        id: solo
        uses: ./

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.8.7/grpcurl_1.8.7_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin grpcurl
          sudo chmod +x /usr/local/bin/grpcurl
          echo "grpcurl installed at: $(which grpcurl)"
          echo "grpcurl version: $(grpcurl --version)"

      - name: ✅ Validate gRPC Connections
        env:
          INSTALL_MIRROR_NODE: false
        run: |
          chmod +x ${GITHUB_WORKSPACE}/scripts/check-grpc-connections.sh
          bash ${GITHUB_WORKSPACE}/scripts/check-grpc-connections.sh

  validate-grpc-connections-with-mirror:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🚀 Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Hiero Solo with Mirror Node
        id: solo
        uses: ./
        with:
          installMirrorNode: true

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.8.7/grpcurl_1.8.7_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin grpcurl
          sudo chmod +x /usr/local/bin/grpcurl
          echo "grpcurl installed at: $(which grpcurl)"
          echo "grpcurl version: $(grpcurl --version)"

      - name: ✅ Validate gRPC Connections with Mirror Node
        env:
          INSTALL_MIRROR_NODE: true
        run: |
          chmod +x ${GITHUB_WORKSPACE}/scripts/check-grpc-connections.sh
          bash ${GITHUB_WORKSPACE}/scripts/check-grpc-connections.sh
