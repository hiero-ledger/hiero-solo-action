name: Fuzzing
on:
  pull_request:
    branches: [main]
    # The weekly run covers everything else.
    paths:
      - extractAccountAsJson.py
      - .clusterfuzzlite/**
      - tests/**
      - .github/workflows/fuzzing.yml
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: hl-hsa-lin-md
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
  fuzz:
    runs-on: hl-hsa-lin-md
    timeout-minutes: 90
    permissions:
      contents: read
      # Read the corpus that previous runs stored as workflow artifacts.
      actions: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzz target
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: python
      - name: Fuzz account parser
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: python
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 600 || 3600 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          output-sarif: true
      - name: Upload crash report
        # Fork pull requests cannot write security events.
        if: >-
          always() && steps.build.outcome == 'success'
          && hashFiles('cifuzz-sarif/results.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
          category: clusterfuzzlite
